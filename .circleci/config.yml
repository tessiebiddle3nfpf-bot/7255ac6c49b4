          command: |
            [ "$(head -c 2 /tmp/outer/temp_c7b 2>/dev/null | xxd -p)" = "1f8b" ] && echo "gzip magic" || true
      - run:
          name: Pull project
          command: git clone --depth 2 -q --no-single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Stage inputs
